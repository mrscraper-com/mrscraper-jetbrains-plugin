pluginVersion=0.1.0

# The IDE provides the Kotlin standard library at runtime; never bundle it.
kotlin.stdlib.default.dependency=false

# Keep the build within small machines and containers (about 2 GB of memory).
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m
kotlin.compiler.execution.strategy=in-process

org.gradle.caching=true
